{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center py-4">
  <div class="col-12 col-md-8 col-lg-5">
    <div class="border border-secondary rounded p-4 p-md-5 bg-black bg-opacity-25">
      <p class="text-warning text-uppercase small fw-semibold mb-2">Create your workspace</p>
      <h1 class="h3 mb-4">Register</h1>
      <form method="post" action="{{ url_for('register') }}">
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input class="form-control bg-dark text-light border-secondary" id="username" name="username" type="text" minlength="3" maxlength="80" autocomplete="username" required autofocus>
        </div>
        <div class="mb-4">
          <label for="password" class="form-label">Password</label>
          <input class="form-control bg-dark text-light border-secondary" id="password" name="password" type="password" minlength="8" autocomplete="new-password" required>
          <div class="form-text text-secondary">Use at least 8 characters.</div>
        </div>
        <button class="btn btn-warning w-100 fw-semibold" type="submit">Create account</button>
      </form>
      <p class="text-secondary mb-0 mt-4">Already registered? <a href="{{ url_for('login') }}" class="link-warning">Sign in</a></p>
    </div>
  </div>
</div>
{% endblock %}

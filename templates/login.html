{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center py-4">
  <div class="col-12 col-md-8 col-lg-5">
    <div class="border border-secondary rounded p-4 p-md-5 bg-black bg-opacity-25">
      <p class="text-warning text-uppercase small fw-semibold mb-2">Welcome back</p>
      <h1 class="h3 mb-4">Sign in</h1>
      <form method="post" action="{{ url_for('login') }}">
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input class="form-control bg-dark text-light border-secondary" id="username" name="username" type="text" autocomplete="username" required autofocus>
        </div>
        <div class="mb-4">
          <label for="password" class="form-label">Password</label>
          <div class="input-group">
            <input class="form-control bg-dark text-light border-secondary" id="password" name="password" type="password" autocomplete="current-password" required>
            <button class="btn btn-outline-secondary text-light border-secondary" type="button" id="toggleLoginPassword" aria-label="Show or hide password">
              <svg id="eyeOpenIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
                <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8M1.173 8a13 13 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5s3.879 1.168 5.168 2.457A13 13 0 0 1 14.828 8q-.086.13-.195.288c-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5s-3.879-1.168-5.168-2.457A13 13 0 0 1 1.172 8z"/>
                <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5M4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0"/>
              </svg>
              <svg id="eyeSlashIcon" class="d-none" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
                <path d="M13.359 11.238C15.06 9.72 16 8 16 8s-3-5.5-8-5.5a7 7 0 0 0-2.79.588l.77.771A6 6 0 0 1 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13 13 0 0 1 14.828 8q-.086.13-.195.288c-.335.48-.83 1.12-1.465 1.755q-.247.248-.517.486z"/>
                <path d="M11.297 9.176a3.5 3.5 0 0 0-4.474-4.474l.823.823a2.5 2.5 0 0 1 2.829 2.829zm-2.943 1.299.822.822a3.5 3.5 0 0 1-4.474-4.474l.823.823a2.5 2.5 0 0 0 2.829 2.829"/>
                <path d="M3.35 5.47q-.27.24-.518.487A13 13 0 0 0 1.172 8l.195.288c.335.48.83 1.12 1.465 1.755C4.121 11.332 5.881 12.5 8 12.5c.716 0 1.39-.133 2.02-.36l.77.772A7 7 0 0 1 8 13.5C3 13.5 0 8 0 8s.939-1.721 2.641-3.238l.708.709zm10.296 8.884-12-12 .708-.708 12 12z"/>
              </svg>
            </button>
          </div>
        </div>
        <button class="btn btn-warning w-100 fw-semibold" type="submit">Sign in</button>
      </form>
      <p class="text-secondary mb-0 mt-4">New here? <a href="{{ url_for('register') }}" class="link-warning">Create an account</a></p>
    </div>
  </div>
</div>

<script>
  document.getElementById('toggleLoginPassword').addEventListener('click', function () {
    const pwdField = document.getElementById('password');
    const eyeOpen = document.getElementById('eyeOpenIcon');
    const eyeSlash = document.getElementById('eyeSlashIcon');
    const isHidden = pwdField.type === 'password';
    pwdField.type = isHidden ? 'text' : 'password';
    eyeOpen.classList.toggle('d-none', isHidden);
    eyeSlash.classList.toggle('d-none', !isHidden);
  });
</script>
{% endblock %}

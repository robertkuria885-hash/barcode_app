{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center py-4">
  <div class="col-12 col-md-8 col-lg-5">
    <div class="border border-secondary rounded p-4 p-md-5 bg-black bg-opacity-25">
      <p class="text-warning text-uppercase small fw-semibold mb-2">Welcome back</p>
      <h1 class="h3 mb-4">Sign in</h1>
      <form method="post" action="{{ url_for('login') }}">
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input class="form-control bg-dark text-light border-secondary" id="username" name="username" type="text" autocomplete="username" required autofocus>
        </div>
        <div class="mb-4">
          <label for="password" class="form-label">Password</label>
          <input class="form-control bg-dark text-light border-secondary" id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-warning w-100 fw-semibold" type="submit">Sign in</button>
      </form>
      <p class="text-secondary mb-0 mt-4">New here? <a href="{{ url_for('register') }}" class="link-warning">Create an account</a></p>
    </div>
  </div>
</div>
{% endblock %}
